name: Update Product Versions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run version update pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run update-versions

      - name: Run test suite
        run: bun test

      - name: Verify production build
        run: bun run build

      - name: Commit and push updated versions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain src/data/product-versions.json)" ]; then
            git add src/data/product-versions.json
            git commit -m "chore(products): auto-update product versions [skip ci]"
            git push
            echo "Successfully committed and pushed updated product versions."
          else
            echo "No product version changes detected."
          fi
